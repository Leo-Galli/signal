; PlatformIO project for Chapter 14 ESP32 LoRa P2P ping.
; Fail-safe defaults: low TX power, software duty-cycle cap, CRC + sequence.
; Not legal advice. Cap power/duty to your Chapter 3 worksheet before field use.

[platformio]
src_dir = firmware/src
include_dir = firmware/include
default_envs = esp32-sx1276-a

[common]
lib_deps =
  jgromes/RadioLib@^6.5.0
build_flags =
  -DLORA_FREQ_MHZ=433.05
  -DLORA_SF=7
  -DLORA_BW_KHZ=125.0
  -DLORA_CR=5
  -DLORA_TX_DBM=2
  -DDUTY_CYCLE_PERCENT=10
  -DPING_INTERVAL_MS=5000
  -DCS_PIN=5
  -DDIO0_PIN=26
  -DRST_PIN=14
  -DDIO1_PIN=33

; Node A: initiates ping. SX1276/78 breakout default.
[env:esp32-sx1276-a]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = ${common.lib_deps}
build_flags =
  ${common.build_flags}
  -DNODE_ROLE=1
  -DMODULE_SX1276=1

; Node B: replies with pong + RSSI/SNR of the request.
[env:esp32-sx1276-b]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = ${common.lib_deps}
build_flags =
  ${common.build_flags}
  -DNODE_ROLE=2
  -DMODULE_SX1276=1

; SX1262 breakout (SPI). Same pin defaults; adjust build_flags for your wiring.
[env:esp32-sx1262-a]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = ${common.lib_deps}
build_flags =
  ${common.build_flags}
  -DNODE_ROLE=1
  -DMODULE_SX1262=1

[env:esp32-sx1262-b]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = ${common.lib_deps}
build_flags =
  ${common.build_flags}
  -DNODE_ROLE=2
  -DMODULE_SX1262=1

; E22-400M30S class (SX1268 + PA). Keep LORA_TX_DBM low -- module can exceed SRD.
[env:esp32-e22-a]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = ${common.lib_deps}
build_flags =
  ${common.build_flags}
  -DNODE_ROLE=1
  -DMODULE_E22=1

[env:esp32-e22-b]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = ${common.lib_deps}
build_flags =
  ${common.build_flags}
  -DNODE_ROLE=2
  -DMODULE_E22=1
