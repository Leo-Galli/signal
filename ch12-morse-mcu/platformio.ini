; PlatformIO project for Chapter 12 Morse MCU keyer/decoder.
; Practice oscillator / serial decode only -- no RF path in this firmware.

[platformio]
src_dir = firmware/src
include_dir = firmware/include
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -DKEY_PIN=15
  -DTONE_PIN=25
  -DPOT_PIN=34
  -DLED_PIN=2

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_flags =
  -DKEY_PIN=2
  -DTONE_PIN=8
  -DPOT_PIN=A0
  -DLED_PIN=13
