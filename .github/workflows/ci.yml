name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Smoke check
        run: |
          test -f LICENSE
          test -f README.md
          test -f CONTRIBUTING.md
          python -c "print('smoke ok')"

  ch01-waves:
    name: ch01-waves
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ch01-waves
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install plot dependency
        run: pip install matplotlib

      - name: Unit tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: .

