name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Smoke check
        run: |
          test -f LICENSE
          test -f README.md
          test -f CONTRIBUTING.md
          python -c "print('smoke ok')"
