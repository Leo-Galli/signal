; PlatformIO project for Chapter 17 field beacon (capstone).
; Default DRY_RUN=1 never keys RF. Match power/duty to Chapter 3 worksheet.
; Not legal advice.

[platformio]
src_dir = firmware/src
include_dir = firmware/include
default_envs = esp32-beacon-dry

[common]
lib_deps =
  jgromes/RadioLib@^6.5.0
build_flags =
  -DLORA_FREQ_MHZ=433.05
  -DLORA_SF=7
  -DLORA_BW_KHZ=125.0
  -DLORA_CR=5
  -DLORA_TX_DBM=2
  -DDUTY_CYCLE_PERCENT=10
  -DBEACON_INTERVAL_MS=30000
  -DMORSE_WPM=15
  -DCS_PIN=5
  -DDIO0_PIN=26
  -DRST_PIN=14
  -DDIO1_PIN=33
  -DGPS_RX_PIN=16
  -DGPS_TX_PIN=17
  -DTONE_PIN=25
  -DBTN_SOS_PIN=32
  -DBTN_SEND_PIN=27
  -DBTN_MORSE_PIN=12
  -DBTN_DRY_PIN=13
  -DBEACON_NAME=\"MAKER\"

; Stock teaching build: dry-run ON (never radio.transmit). CI default.
[env:esp32-beacon-dry]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = ${common.lib_deps}
build_flags =
  ${common.build_flags}
  -DDRY_RUN=1
  -DMODULE_SX1276=1

; Live RF path -- flash only after Chapter 3 worksheet + antenna attached.
[env:esp32-beacon-sx1276]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = ${common.lib_deps}
build_flags =
  ${common.build_flags}
  -DDRY_RUN=0
  -DMODULE_SX1276=1

[env:esp32-beacon-e22]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = ${common.lib_deps}
build_flags =
  ${common.build_flags}
  -DDRY_RUN=0
  -DMODULE_E22=1
  -DDRY_RUN_DEFAULT_WARN=1
